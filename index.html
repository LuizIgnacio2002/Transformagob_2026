<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="OncoRuta Mujer Inteligente - Sistema digital de navegación del paciente del INEN para un diagnóstico oportuno, equitativo, inclusivo e intercultural." />
  <meta name="theme-color" content="#14746f" />
  <title>OncoRuta Mujer Inteligente · INEN</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Hoja de estilos modular: tokens -> base -> layout -> componentes -> vistas -> accesibilidad -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/views.css" />
  <link rel="stylesheet" href="css/accessibility.css" />
</head>

<body data-font-scale="1" data-contrast="normal" data-lang="es">
  <!-- Enlace de salto para lectores de pantalla / teclado (accesibilidad WCAG) -->
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

  <!-- Región viva para anuncios accesibles (aria-live) -->
  <div id="a11y-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Contenedor raíz de la aplicación: el router inyecta cada vista aquí -->
  <div id="app" class="app-root"></div>

  <!-- Contenedor de notificaciones tipo toast -->
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>

  <!-- Contenedor de modales -->
  <div id="modal-root"></div>

  <!--
    Carga ordenada de scripts clásicos (NO módulos ES) para que el proyecto
    funcione abriendo index.html directamente (file://) sin necesidad de un
    servidor. Cada archivo se registra en el espacio de nombres global
    `window.App`, manteniendo la separación por responsabilidad.

    El orden importa: las dependencias se cargan antes que quienes las usan.
  -->
  <!-- 1) Base: configuración, idioma y datos -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/mockData.js"></script>

  <!-- 2) Núcleo: estado, utilidades, notificaciones, backend simulado -->
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/api.js"></script>

  <!-- 3) Accesibilidad -->
  <script src="js/a11y.js"></script>

  <!-- 4) Vistas -->
  <script src="js/views/login.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/ruta.js"></script>
  <script src="js/views/citas.js"></script>
  <script src="js/views/documentos.js"></script>
  <script src="js/views/orientacion.js"></script>
  <script src="js/views/notificaciones.js"></script>
  <script src="js/views/apoyo.js"></script>
  <script src="js/views/perfil.js"></script>
  <script src="js/views/panel.js"></script>
  <script src="js/views/pacientes.js"></script>
  <script src="js/views/indicadores.js"></script>

  <!-- 5) Enrutador y arranque -->
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
